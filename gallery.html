<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Annotation &amp; Image Gallery — Autobiography of a Yogi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=5" />
  <style>
    .g-head { max-width:1200px; margin:0 auto; padding:26px 20px 6px; }
    .g-head h1 { font-family:var(--serif); font-size:34px; margin:0 0 4px; }
    .g-head p { font-family:var(--sans); color:var(--ink-soft); margin:0 0 18px; font-size:14px; }
    .g-head .top { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .g-back { font-family:var(--sans); font-size:14px; color:var(--accent); text-decoration:none; border:1px solid var(--accent); padding:7px 14px; border-radius:20px; }
    .g-back:hover { background:var(--accent-soft); }
    .g-search { width:100%; max-width:420px; padding:10px 14px; font-family:var(--sans); font-size:15px;
      border:1px solid var(--line); border-radius:10px; background:var(--paper); color:var(--ink); margin-bottom:20px; }
    .g-stat { font-family:var(--sans); font-size:13px; color:var(--ink-soft); margin:0 0 18px; }
    .g-grid { max-width:1200px; margin:0 auto; padding:0 20px 60px; display:grid;
      grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:18px; }
    .g-card { background:var(--paper); border:1px solid var(--line); border-radius:14px; overflow:hidden;
      display:flex; flex-direction:column; box-shadow:0 6px 18px rgba(0,0,0,.05); position:relative; }
    /* crop biased toward the face so heads are never cut off */
    .g-img { width:100%; aspect-ratio:3/4; object-fit:cover; object-position:center 18%; background:var(--sidebar-bg); }
    .g-nopic { width:100%; height:210px; display:flex; align-items:center; justify-content:center;
      font-family:var(--sans); color:var(--ink-soft); font-size:12px; background:var(--sidebar-bg); }
    .g-num { position:absolute; top:8px; left:8px; z-index:2; background:var(--ink); color:var(--paper);
      border-radius:50%; min-width:28px; height:28px; padding:0 6px; display:flex; align-items:center; justify-content:center;
      font-family:var(--sans); font-size:13px; font-weight:600; box-shadow:0 2px 8px rgba(0,0,0,.35); }
    .g-body { padding:12px 14px 14px; display:flex; flex-direction:column; gap:8px; flex:1; }
    .g-label { font-family:var(--serif); font-weight:600; font-size:19px; line-height:1.15; }
    .g-id { font-family:var(--sans); font-size:11px; color:var(--ink-soft); }
    .g-terms { display:flex; flex-wrap:wrap; gap:5px; }
    .g-term { font-family:var(--sans); font-size:11px; background:var(--accent-soft); color:var(--ink);
      padding:2px 7px; border-radius:10px; }
    .g-note { font-family:var(--serif); font-size:14.5px; line-height:1.5; color:var(--ink); margin:0; }
    .g-links { margin-top:auto; display:flex; flex-wrap:wrap; gap:8px; }
    .g-links a { font-family:var(--sans); font-size:12.5px; color:var(--accent); text-decoration:none; }
    .g-links a:hover { text-decoration:underline; }
    @media (max-width:680px){ .g-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));} .g-card{font-size:.95em;} .g-nopic{height:150px;} }
  </style>
</head>
<body>
  <header class="g-head">
    <div class="top">
      <h1>Annotation &amp; Image Gallery</h1>
      <a class="g-back" href="index.html">← Back to Reader</a>
    </div>
    <p>Every highlighted word in <em>Autobiography of a Yogi</em> is numbered below (<strong>#N</strong>) so you can refer to it when commenting. Click an image to view it full-size on Wikimedia Commons.</p>
    <input id="g-search" class="g-search" type="search" placeholder="Filter by label or note… (numbers stay fixed)" />
    <p id="g-stat" class="g-stat"></p>
  </header>
  <div id="g-grid" class="g-grid"></div>

  <script src="annotations.js?v=5"></script>
  <script>
    (function () {
      "use strict";
      const fileUrl = "https://commons.wikimedia.org/wiki/Special:FilePath/";
      const A = window.ANNOTATIONS || [];
      // stable order for stable numbers: sort alphabetically by id once
      const items = A.slice().sort(function (x, y) { return x.id < y.id ? -1 : (x.id > y.id ? 1 : 0); })
                            .map(function (a, i) { return { a: a, num: i + 1 }; });
      const grid = document.getElementById("g-grid");
      const stat = document.getElementById("g-stat");
      const box = document.getElementById("g-search");
      const esc = function (s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); };
      function imgUrl(file, w) {
        return fileUrl + encodeURIComponent(String(file).replace(/ /g,"_")) + "?width=" + (w || 560);
      }
      function card(it) {
        const a = it.a;
        const img = a.image
          ? '<a href="'+imgUrl(a.image,1600)+'" target="_blank" rel="noopener"><img class="g-img" loading="lazy" src="'+imgUrl(a.image)+'" alt="'+esc(a.label)+'" onerror="this.style.display=\'none\'"/></a>'
          : '<div class="g-nopic">no image</div>';
        const terms = (a.terms||[]).map(function(t){ return '<span class="g-term">'+esc(t)+'</span>'; }).join("");
        const links = (a.links||[]).map(function(l){ return '<a href="'+esc(l.url)+'" target="_blank" rel="noopener">↗ '+esc(l.label)+'</a>'; }).join("");
        return '<div class="g-card" data-q="'+esc((a.label+" "+(a.note||"")+" "+(a.terms||[]).join(" ")).toLowerCase())+'">'
          + '<span class="g-num">#'+it.num+'</span>'
          + img
          + '<div class="g-body">'
          + '<div class="g-label">'+esc(a.label)+'</div>'
          + '<div class="g-id">'+esc(a.id)+'</div>'
          + '<div class="g-terms">'+terms+'</div>'
          + '<p class="g-note">'+esc(a.note||"")+'</p>'
          + '<div class="g-links">'+links+'</div>'
          + '</div></div>';
      }
      function qtext(a) { return (a.label+" "+(a.note||"")+" "+(a.terms||[]).join(" ")).toLowerCase(); }
      function render(filter) {
        const f = (filter||"").toLowerCase().trim();
        const shown = items.filter(function (it) { return !f || qtext(it.a).indexOf(f) >= 0; });
        grid.innerHTML = shown.map(card).join("");
        const withImg = A.filter(function(a){ return a.image; }).length;
        stat.textContent = "Showing " + shown.length + " of " + items.length + " annotations · "
          + withImg + " have images · " + (items.length - withImg) + " text-only · numbers fixed by sorted order";
      }
      box.addEventListener("input", function () { render(box.value); });
      render("");
    })();
  </script>
</body>
</html>
